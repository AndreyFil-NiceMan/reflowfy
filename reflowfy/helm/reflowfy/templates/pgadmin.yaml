{{- if .Values.pgadmin.enabled }}
{{- $pwSecret := .Values.pgadmin.auth.existingSecret | default (printf "%s-pgadmin" .Release.Name) }}
{{- $pwKey := .Values.pgadmin.auth.existingSecretPasswordKey | default "password" }}
{{- if not .Values.pgadmin.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-pgadmin
  labels:
    {{- include "reflowfy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgadmin
type: Opaque
data:
  {{/* Keep a generated password stable across upgrades, otherwise every
       `helm upgrade` would silently invalidate the operator's login. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-pgadmin" .Release.Name) }}
  {{- if .Values.pgadmin.auth.password }}
  password: {{ .Values.pgadmin.auth.password | b64enc | quote }}
  {{- else if and $existing $existing.data.password }}
  password: {{ $existing.data.password | quote }}
  {{- else }}
  password: {{ randAlphaNum 20 | b64enc | quote }}
  {{- end }}
---
{{- end }}
{{/* Preconfigured server entry so the operator does not retype connection
     details. pgAdmin imports this on first start; the password is not stored
     here, it is prompted once in the UI. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pgadmin-servers
  labels:
    {{- include "reflowfy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgadmin
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": {{ .Values.pgadmin.serverName | quote }},
          "Group": "Servers",
          "Host": {{ include "reflowfy.postgresql.host" . | quote }},
          "Port": {{ include "reflowfy.postgresql.port" . }},
          "MaintenanceDB": {{ include "reflowfy.postgresql.database" . | quote }},
          "Username": {{ include "reflowfy.postgresql.username" . | quote }},
          "SSLMode": "prefer"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pgadmin
  labels:
    {{- include "reflowfy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgadmin
spec:
  replicas: {{ .Values.pgadmin.replicaCount }}
  selector:
    matchLabels:
      app: reflowfy-pgadmin
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- if .Values.deployTimestamp }}
      annotations:
        reflowfy.io/restartedAt: {{ .Values.deployTimestamp | quote }}
      {{- end }}
      labels:
        app: reflowfy-pgadmin
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pgadmin
    spec:
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pgadmin
          image: {{ .Values.pgadmin.image | quote }}
          imagePullPolicy: {{ .Values.pgadmin.imagePullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: {{ .Values.pgadmin.auth.email | quote }}
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pwSecret }}
                  key: {{ $pwKey }}
            {{/* Single-user desktop mode: no extra login layer in front of the
                 one we already set above. */}}
            - name: PGADMIN_CONFIG_SERVER_MODE
              value: "False"
            - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
              value: "False"
            {{/* pgAdmin listens on 80 in-container; OpenShift runs as a
                 non-root UID, so bind high and map via the Service. */}}
            - name: PGADMIN_LISTEN_PORT
              value: "80"
          volumeMounts:
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: data
              mountPath: /var/lib/pgadmin
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.pgadmin.resources | nindent 12 }}
      volumes:
        - name: servers
          configMap:
            name: {{ .Release.Name }}-pgadmin-servers
        - name: data
        {{- if .Values.pgadmin.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pgadmin
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pgadmin
  labels:
    {{- include "reflowfy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgadmin
spec:
  type: {{ .Values.pgadmin.service.type }}
  ports:
    - port: {{ .Values.pgadmin.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: reflowfy-pgadmin
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.pgadmin.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-pgadmin
  labels:
    {{- include "reflowfy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgadmin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pgadmin.persistence.size }}
{{- end }}
{{- if .Values.pgadmin.route.enabled }}
---
{{/* pgAdmin is plain HTTP, so edge termination works. This is the whole reason
     pgAdmin lives in-cluster instead of exposing Postgres: a Route cannot carry
     the Postgres wire protocol, but it carries HTTP natively. */}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-pgadmin
  labels:
    {{- include "reflowfy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgadmin
  {{- with .Values.pgadmin.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.pgadmin.route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ .Release.Name }}-pgadmin
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
