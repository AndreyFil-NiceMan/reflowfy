{{- if and .Values.postgresql.enabled .Values.postgresql.route.enabled }}
{{- if not .Values.postgresql.tls.enabled }}
{{- fail "postgresql.route.enabled=true requires postgresql.tls.enabled=true: the OpenShift router matches on TLS SNI, so a passthrough Route only works against a TLS-enabled Postgres. Set postgresql.tls.enabled=true and postgresql.tls.autoGenerated=true (or supply tls.certificatesSecret)." }}
{{- end }}
{{/* The chart default passwords are public knowledge - they are committed in
     values.yaml. Fine behind a ClusterIP; not fine on the public apps domain.
     Check the superuser too: the Route exposes the whole server, so leaving
     postgres/reflowfy open would undo changing the application user. */}}
{{- if eq .Values.postgresql.auth.password "reflowfy" }}
{{- fail "postgresql.route.enabled=true with the default password: the Route publishes PostgreSQL on the cluster's public apps domain, and 'reflowfy' is the committed chart default. Set postgresql.auth.password (reflowfy deploy --postgres-password ...) to something else. Note the Bitnami chart only applies this at initdb time - on an existing database, ALTER USER first, then upgrade." }}
{{- end }}
{{- if eq .Values.postgresql.auth.postgresPassword "reflowfy" }}
{{- fail "postgresql.route.enabled=true with the default superuser password: the Route exposes the whole server, so the 'postgres' superuser is reachable too. Set postgresql.auth.postgresPassword as well (reflowfy deploy --postgres-password sets both)." }}
{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    {{- include "reflowfy.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- with .Values.postgresql.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.postgresql.route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ .Release.Name }}-postgresql
  port:
    targetPort: tcp-postgresql
  tls:
    termination: passthrough
{{- end }}
