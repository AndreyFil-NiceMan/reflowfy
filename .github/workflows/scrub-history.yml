# One-off: remove an old example name from the whole git history.
# Run it from the Actions tab, type SCRUB, then delete this file.
#
# Only commits that descend from the first commit containing the name are
# rewritten; every other branch and tag keeps its SHA and signature.
# A full backup of the repository is uploaded as an artifact first.
# The push is atomic: if any ref is protected or moved, nothing changes.
#
# The searched-for strings are assembled at run time so that this file
# itself never contains them.

name: Scrub history (one-off)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SCRUB to rewrite and force-push"
        required: true

permissions:
  contents: write

jobs:
  scrub:
    if: github.event.inputs.confirm == 'SCRUB'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror clone
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --mirror "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" repo.git

      - name: Back up everything
        run: git -C repo.git bundle create "$GITHUB_WORKSPACE/before-scrub.bundle" --all

      - uses: actions/upload-artifact@v4
        with:
          name: before-scrub-backup
          path: before-scrub.bundle
          retention-days: 30

      - name: Rewrite
        run: |
          set -euo pipefail
          pip install --quiet git-filter-repo
          cd repo.git
          NAME="stt""_engines"
          CFG="Settings"".KAFKA"
          FIRST=$(git log --all --format=%H -S "$NAME" | tail -n 1)
          if [ -z "$FIRST" ]; then echo "Nothing to scrub."; exit 0; fi
          echo "First commit: $(git log -1 --format='%h %s' "$FIRST")"
          {
            echo "${NAME}==>by_region"
            echo "${CFG}==>KAFKA_SETTINGS"
            echo 'f"stt''-{==>f"orders-{'
          } > ../scrub.txt
          git for-each-ref --contains "$FIRST" --format='%(objectname) %(refname)' refs/heads refs/tags > ../before.txt
          git for-each-ref --no-contains "$FIRST" --format='^%(refname)' refs/heads refs/tags > ../keep.txt
          echo "Refs to rewrite: $(wc -l < ../before.txt)"
          git filter-repo --force --replace-text ../scrub.txt --replace-message ../scrub.txt \
            --refs $(awk '{print $2}' ../before.txt) $(cat ../keep.txt) "^${FIRST}^@"
          left=$(git log --branches --tags --oneline -S "$NAME" | wc -l)
          left_cfg=$(git log --branches --tags --oneline -S "$CFG" | wc -l)
          msgs=$(git log --branches --tags --format=%B | grep -c -e "$NAME" -e "$CFG" || true)
          echo "Left after rewrite: $left / $left_cfg / messages $msgs"
          if [ "$left" != 0 ] || [ "$left_cfg" != 0 ] || [ "$msgs" != 0 ]; then
            echo "Scrub incomplete, not pushing."; exit 1
          fi

      - name: Force-push (atomic, pinned to the old SHAs)
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo.git
          [ -f ../before.txt ] || exit 0
          args=()
          while read -r old ref; do
            args+=("--force-with-lease=${ref}:${old}" "+${ref}:${ref}")
          done < ../before.txt
          git push --atomic "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" "${args[@]}"
          echo "Pushed ${#args[@]} refspecs."
