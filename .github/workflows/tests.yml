name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # No later step needs git credentials; don't leave the token in .git/config
          # (the job uploads an artifact).
          persist-credentials: false

      # GitHub's own actions only; uv comes from PyPI at a pinned version rather
      # than a third-party action pinned to a movable tag.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pytest / pytest-cov live in the `dev` extra, not the dev dependency group.
      - name: Install
        run: |
          python -m pip install "uv==0.11.32"
          uv sync --all-extras --python "$(command -v python)"

      - name: Lint
        run: uv run ruff check reflowfy/

      - name: Type check
        # Must stay at 0 errors (CLAUDE.md).
        run: uv run pyright

      - name: Unit tests with coverage
        # fail_under in [tool.coverage.report] is the gate.
        run: uv run pytest tests/unit --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
