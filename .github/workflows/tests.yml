name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # pytest / pytest-cov live in the `dev` extra, not the dev dependency group.
      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check reflowfy/

      - name: Type check
        # Must stay at 0 errors (CLAUDE.md).
        run: uv run pyright

      - name: Unit tests with coverage
        # fail_under in [tool.coverage.report] is the gate.
        run: uv run pytest tests/unit --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
