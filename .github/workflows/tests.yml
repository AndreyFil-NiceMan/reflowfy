name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    # The suite takes ~2 minutes; a hang must fail, not hold a runner for hours.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # No later step needs git credentials; don't leave the token in .git/config
          # (the job uploads an artifact).
          persist-credentials: false

      # Actions are pinned to commit SHAs (tags can be moved); uv comes from PyPI at
      # a pinned version.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # Dependencies come from uv.lock exactly (--locked) and as wheels only
      # (--no-build: no third-party setup scripts run). reflowfy itself has no wheel,
      # so it is not installed; the steps import it from the checkout (PYTHONPATH).
      # pytest / pytest-cov live in the `dev` extra, not the dev dependency group.
      - name: Install
        run: |
          python -m pip install --only-binary :all: "uv==0.11.32"
          uv sync --all-extras --locked --no-build --no-install-project --python "$(command -v python)"

      - name: Lint
        run: uv run --locked --no-build --no-sync ruff check reflowfy/

      - name: Type check
        # Must stay at 0 errors (CLAUDE.md).
        run: uv run --locked --no-build --no-sync pyright

      - name: Unit tests with coverage
        # fail_under in [tool.coverage.report] is the gate. --timeout fails a hung test
        # and dumps every thread's stack, so the log shows where it stuck.
        run: >-
          uv run --locked --no-build --no-sync
          pytest tests/unit --timeout=300 --timeout-method=thread
          --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
