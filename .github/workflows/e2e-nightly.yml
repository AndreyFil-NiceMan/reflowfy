name: E2E (nightly)

# The production path — manager → Kafka → workers — only has unit coverage in the PR
# workflow. Every night (and on demand) this runs, against the local Docker stack:
#   1. the local-mode E2E suite (scripts/run_e2e_tests.sh),
#   2. the distributed suite over Kafka and real workers, Elasticsearch tests included,
#   3. the chaos tests (a worker / the manager killed mid-run), on their own.
# See CLAUDE.md "Distributed E2E suite" for the same steps by hand.

on:
  schedule:
    - cron: "17 2 * * *"  # 02:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      REFLOWFY_BASE_IMAGE: reflowfy-base:local
      E2E_DIST_MANAGER_URL: http://localhost:8002
      E2E_DIST_SINK_URL: http://localhost:8090
      E2E_DIST_ES_INTERNAL_URL: http://reflofy-e2e-elasticsearch:9200
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --only-binary :all: "uv==0.11.32"
          uv sync --all-extras --locked

      - name: Local-mode E2E (leaves the stack up)
        run: ./scripts/run_e2e_tests.sh --keep-docker

      - name: Switch the stack to distributed mode, with the sink
        working-directory: e2e_workspace
        run: |
          cp ../tests/e2e_distributed/pipelines/dist_*.py tests/e2e/test_pipelines/
          docker compose -f docker-compose.yml \
            -f ../scripts/e2e-distributed.override.yml \
            -f ../scripts/e2e-distributed-sink.override.yml \
            up -d --build worker reflow-manager api e2e-sink
          for _ in $(seq 1 60); do
            curl -fsS "$E2E_DIST_MANAGER_URL/health" >/dev/null && exit 0
            sleep 5
          done
          docker compose logs reflow-manager | tail -100
          exit 1

      - name: Seed Elasticsearch for the needs_es tests
        run: python scripts/seed_es_docs.py --url http://localhost:9201 --count 20000

      - name: Distributed E2E (no chaos)
        env:
          E2E_DIST_ES: "1"
        run: uv run pytest tests/e2e_distributed -m "not chaos" --timeout=1800 -v

      - name: Local E2E suite again, over Kafka and real workers
        # tests/e2e runs over Kafka with e2e-distributed.override.yml in place.
        run: uv run pytest tests/e2e/test_authoring_api.py tests/e2e/test_framework_gaps.py --timeout=1800 -v

      - name: Chaos (kills a worker / the manager)
        env:
          E2E_DIST_KILL_WORKER_CMD: docker restart -t 0 reflofy-e2e-worker
          E2E_DIST_RESTART_MANAGER_CMD: docker restart -t 0 reflofy-e2e-reflow-manager
        run: uv run pytest tests/e2e_distributed -m chaos --timeout=1800 -v

      - name: Service logs
        if: failure()
        working-directory: e2e_workspace
        run: |
          docker compose -f docker-compose.yml \
            -f ../scripts/e2e-distributed.override.yml \
            -f ../scripts/e2e-distributed-sink.override.yml \
            logs --tail=300 reflow-manager worker api e2e-sink || true

      - name: Tear down
        if: always()
        working-directory: e2e_workspace
        run: |
          docker compose -f docker-compose.yml \
            -f ../scripts/e2e-distributed.override.yml \
            -f ../scripts/e2e-distributed-sink.override.yml \
            down --remove-orphans -v || true
          docker compose -f docker-compose.e2e-infra.yml down --remove-orphans -v || true
